services:
  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci --frozen-lockfile && npm run build"
    profiles:
      - build

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl/certbot/conf:/etc/letsencrypt:ro
      - ./docker/ssl/certbot/www:/var/www/certbot:ro
    depends_on:
      - node
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/ssl/certbot/conf:/etc/letsencrypt
      - ./docker/ssl/certbot/www:/var/www/certbot
    profiles:
      - ssl
